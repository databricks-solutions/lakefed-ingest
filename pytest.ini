[pytest]
# Tests for both versions: the default version (tests/), the job-orchestration version
# (job_orchestration/tests/), and the optional operations app (app/tests/). Source modules are put on sys.path by each suite (tests/conftest.py;
# job_orchestration/tests/udtf_test.py reads its SQL file by path).
testpaths = tests job_orchestration/tests app/tests
