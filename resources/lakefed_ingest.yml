# Ingestion job — one run sweeps a whole task_collection (no controller / batching).
# Sweeps an entire task_collection in one run: reads all enabled tasks for the collection from
# `control` and ingests them in-process across a thread pool + Spark FAIR scheduler pools (see
# ingest.ipynb / parallel.py). Per control row, `load_type` selects the load strategy (ct | cursor |
# full) and `src_type` the source adapter (sqlserver | oracle | postgresql | mysql). This keeps the pipeline under the workspace job limits
# that a task-per-table design hits (2,000 concurrent task runs; 10,000 run-submits/hour) —
# throughput becomes compute-bound, the intended cost model.
#
# Warehouse-free: everything runs on the job cluster below — source reads via Spark JDBC
# (ct_engine.py; the SQL Server and PostgreSQL JDBC drivers ship with Databricks Runtime, so no
# library install and no UC connection; Oracle / MySQL sources need the driver library — see the
# commented entries under `libraries`), Lakebase state + telemetry via psycopg.
#
# Compute: the sweep is DRIVER-bound (each per-table MERGE costs driver-side planning + a Delta
# commit), so size the driver up and keep workers modest. FAIR scheduling is required for the
# per-table scheduler pools to take effect.
#
# Scale pattern: shard tenants/tables into task_collections and run them CONCURRENTLY (one run per
# collection, each on its own cluster). Runs of different collections don't conflict; a per-collection
# Lakebase lock skips a duplicate run of the same collection. Trigger per collection via the API
# (`run-now` with job_parameters); the job's schedule can only sweep its default collection. The check
# job (lakefed_ingest_check.yml) is the launcher over collections: it checks a group of collections
# first and starts a run only for those with work.
resources:
  jobs:
    lakefed_ingest:
      name: "lakefed_ingest"
      description: "Sweeps an entire task_collection in one task (threads + FAIR scheduler pools)."
      # Concurrent runs are the horizontal-scale pattern: one run per task_collection, each on its
      # own job cluster. Overlap of the SAME collection is prevented inside the sweep by a
      # per-collection Lakebase advisory lock (a duplicate run exits as 'skipped'), so this limit
      # only caps total parallel sweeps — raise it (Jobs max is 1000) as collections are added.
      max_concurrent_runs: 100
      schedule:
        # Paused by default (15-minute cadence). Job schedules can't pass parameters, so this schedule
        # only ever sweeps the job's DEFAULT task_collection. Per-collection cadence needs a job per
        # collection (the app's schedules), or the check job over a group of collections.
        quartz_cron_expression: "0 0/15 * * * ?"
        timezone_id: UTC
        pause_status: PAUSED
      job_clusters:
        - job_cluster_key: sweep_cluster
          new_cluster:
            spark_version: 18.x-scala2.13
            data_security_mode: SINGLE_USER
            node_type_id: ${var.node_type_id}
            driver_node_type_id: ${var.driver_node_type_id}
            num_workers: ${var.num_workers}
            spark_conf:
              spark.scheduler.mode: FAIR
            custom_tags:
              project: lakefed_ingest
      tasks:
        - task_key: ingest
          job_cluster_key: sweep_cluster
          notebook_task:
            notebook_path: ../src/lakefed_ingest/ingest.ipynb
            base_parameters:
              task_collection: "{{job.parameters.task_collection}}"
              work_id: "{{job.parameters.work_id}}"
              db_instance: "{{job.parameters.db_instance}}"
              db_name: "{{job.parameters.db_name}}"
              parallelism: "{{job.parameters.parallelism}}"
              secret_scope: "{{job.parameters.secret_scope}}"
              trust_server_certificate: "{{job.parameters.trust_server_certificate}}"
              snapshot_isolation: "{{job.parameters.snapshot_isolation}}"
              reseed_on_new_columns: "{{job.parameters.reseed_on_new_columns}}"
              append_batch_size: "{{job.parameters.append_batch_size}}"
              max_seeds_per_run: "{{job.parameters.max_seeds_per_run}}"
              freshness_interval_s: "{{job.parameters.freshness_interval_s}}"
              detection_chunk: "{{job.parameters.detection_chunk}}"
              max_queries_per_source: "{{job.parameters.max_queries_per_source}}"
              table_retries: "{{job.parameters.table_retries}}"
              table_retry_budget: "{{job.parameters.table_retry_budget}}"
              fail_on_table_errors: "{{job.parameters.fail_on_table_errors}}"
              spark_conf: "{{job.parameters.spark_conf}}"
          libraries:
            - pypi:
                package: "psycopg[binary]"
            - pypi:
                package: "databricks-sdk==0.145.0"
            # Oracle / MySQL sources: the JDBC driver is NOT bundled in Databricks Runtime. Uncomment
            # the one(s) you need (pin a version your security team has approved).
            # - maven:
            #     coordinates: "com.oracle.database.jdbc:ojdbc11:23.5.0.24.07"
            # - maven:
            #     coordinates: "com.mysql:mysql-connector-j:9.1.0"
      tags:
        business_unit: ""
        project: lakefed_ingest
      queue:
        enabled: false
      # The tuning parameters' defaults are bundle variables of the same name (databricks.yml), so a
      # target can set them; a run can still override any of them.
      parameters:
        - name: task_collection
          default: example_cohort
        # Set by the check job (check_launch.ipynb): this run ingests only the databases it listed in
        # check_work under this id. Blank = the whole collection.
        - name: work_id
          default: ""
        - name: db_instance
          default: ${var.lakebase_instance}
        - name: db_name
          default: ${var.lakebase_database}
        # ONE concurrency knob: max units of query work running at once in this run (CT read+MERGE,
        # a seed, one partition of a partitioned seed, a small source query, the staging swap) —
        # across all tables. Per run: concurrent collections on separate clusters each get their own.
        # 192 is what the one-database tuning sweep validated on one D16ds_v5 driver + 1 x D8ds_v5 worker
        # (most units wait on the source, not the cores). On a server that hosts other work, set
        # max_queries_per_source so every run together stays under what it can take.
        - name: parallelism
          default: ${var.parallelism}
        # Per-DB source credentials (JSON {user, password}); may be Azure Key Vault-backed.
        - name: secret_scope
          default: ${var.secret_scope}
        # Production: "false" with a trusted server certificate (SQL Server trustServerCertificate,
        # PostgreSQL sslmode verify-full vs require, MySQL sslMode VERIFY_IDENTITY vs REQUIRED).
        - name: trust_server_certificate
          default: ${var.trust_server_certificate}
        # Read changes under SNAPSHOT isolation: consistent change rows, but every source database
        # needs ALLOW_SNAPSHOT_ISOLATION ON (otherwise reads fail with SQL Server error 3952).
        - name: snapshot_isolation
          default: ${var.snapshot_isolation}
        # "false": a table whose select_list gained columns carries on from its checkpoint instead of
        # reseeding (rows written before stay NULL in the new columns), e.g. for append sinks, whose
        # history needn't be backfilled with a full snapshot of every table that gained a column.
        - name: reseed_on_new_columns
          default: ${var.reseed_on_new_columns}
        # Append sinks with client_id: up to this many tables appending to the same sink are read in
        # one Spark job (a task per source database) and written in one Delta commit. "1" = per table;
        # 4 is the sweep's validated value (8 loads the same, 16 is slower). A batch holds one
        # `parallelism` slot per table, so raise parallelism with it.
        - name: append_batch_size
          default: ${var.append_batch_size}
        # Onboarding at scale: at most this many seeds per run; the rest seed in later runs, while the
        # tables already seeded keep getting their increments. "0" = no limit.
        - name: max_seeds_per_run
          default: ${var.max_seeds_per_run}
        # Unchanged tables whose checkpoint is already current are written to Lakebase only when their
        # last_success_at is older than this (seconds); at scale these are most of a run's Lakebase writes.
        # "0" = stamp every unchanged table every run.
        - name: freshness_interval_s
          default: ${var.freshness_interval_s}
        # Skip-no-change: tables per batched change-detection statement (one source query per chunk).
        - name: detection_chunk
          default: ${var.detection_chunk}
        # Concurrent queries per source server across every run of every collection: each run
        # takes its share, this divided by the runs reading the server, at least 1 (README
        # "Concurrency" has the limits). "0" = no cap.
        - name: max_queries_per_source
          default: ${var.max_queries_per_source}
        # Table retries: a table that fails with a transient source error (a refused or dropped
        # connection, a timeout, throttling) is tried again in the same run, after a pause that doubles
        # each time. Extra attempts per table; "0" = off. Only when table_retry_budget is above 0.
        - name: table_retries
          default: ${var.table_retries}
        # Retries in the whole run. The default "0" retries no table: a failing table fails the run at once.
        - name: table_retry_budget
          default: ${var.table_retry_budget}
        # Accepted for older jobs; a run with failed tables always ends as failed (ingest.ipynb).
        - name: fail_on_table_errors
          default: ${var.fail_on_table_errors}
        # Spark session settings for this run, a JSON object of setting -> value (blank keeps the
        # cluster's). The default turns whole-stage code generation off: the sinks' clustering on write
        # makes every append's plan compile otherwise, which the sweep measured at +26% tables per second.
        - name: spark_conf
          default: ${var.spark_conf}
