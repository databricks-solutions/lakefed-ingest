# Ingestion job — one run sweeps a whole task_collection (no controller / batching).
# Sweeps an entire task_collection in one run: reads all enabled tasks for the collection from
# `control` and ingests them in-process across a thread pool + Spark FAIR scheduler pools (see
# ingest.ipynb / parallel.py). Per control row, `load_type` selects the load strategy (ct | cursor |
# full) and `src_type` the source adapter (sqlserver | oracle | postgresql | mysql). This keeps the pipeline under the workspace job limits
# that a task-per-table design hits (2,000 concurrent task runs; 10,000 run-submits/hour) —
# throughput becomes compute-bound, the intended cost model.
#
# Warehouse-free: everything runs on the job cluster below — source reads via Spark JDBC
# (ct_engine.py; the SQL Server and PostgreSQL JDBC drivers ship with Databricks Runtime, so no
# library install and no UC connection; Oracle / MySQL sources need the driver library — see the
# commented entries under `libraries`), Lakebase state + telemetry via psycopg.
#
# Compute: the sweep is DRIVER-bound (each per-table MERGE costs driver-side planning + a Delta
# commit), so size the driver up and keep workers modest. FAIR scheduling is required for the
# per-table scheduler pools to take effect.
#
# Scale pattern: shard tenants/tables into task_collections and run them CONCURRENTLY (one run per
# collection, each on its own cluster). Runs of different collections don't conflict; a per-collection
# Lakebase lock skips a duplicate run of the same collection. Trigger per collection via the API
# (`run-now` with job_parameters); the job's schedule can only sweep its default collection, so
# scheduled multi-collection runs need a launcher over collections (planned).
resources:
  jobs:
    lakefed_ingest:
      name: "lakefed_ingest"
      description: "Sweeps an entire task_collection in one task (threads + FAIR scheduler pools)."
      # Concurrent runs are the horizontal-scale pattern: one run per task_collection, each on its
      # own job cluster. Overlap of the SAME collection is prevented inside the sweep by a
      # per-collection Lakebase advisory lock (a duplicate run exits as 'skipped'), so this limit
      # only caps total parallel sweeps — raise it (Jobs max is 1000) as collections are added.
      max_concurrent_runs: 100
      schedule:
        # Paused by default (15-minute cadence). Job schedules can't pass parameters, so this schedule
        # only ever sweeps the job's DEFAULT task_collection. Per-collection cadence needs a job per
        # collection (or a target-level override of the default) or a launcher over collections (planned).
        quartz_cron_expression: "0 0/15 * * * ?"
        timezone_id: UTC
        pause_status: PAUSED
      job_clusters:
        - job_cluster_key: sweep_cluster
          new_cluster:
            spark_version: 18.x-scala2.13
            data_security_mode: SINGLE_USER
            node_type_id: ${var.node_type_id}
            driver_node_type_id: ${var.driver_node_type_id}
            num_workers: ${var.num_workers}
            spark_conf:
              spark.scheduler.mode: FAIR
            custom_tags:
              project: lakefed_ingest
      tasks:
        - task_key: ingest
          job_cluster_key: sweep_cluster
          notebook_task:
            notebook_path: ../src/lakefed_ingest/ingest.ipynb
            base_parameters:
              task_collection: "{{job.parameters.task_collection}}"
              db_instance: "{{job.parameters.db_instance}}"
              db_name: "{{job.parameters.db_name}}"
              parallelism: "{{job.parameters.parallelism}}"
              secret_scope: "{{job.parameters.secret_scope}}"
              trust_server_certificate: "{{job.parameters.trust_server_certificate}}"
              detection_chunk: "{{job.parameters.detection_chunk}}"
          libraries:
            - pypi:
                package: "psycopg[binary]"
            - pypi:
                package: "databricks-sdk==0.145.0"
            # Oracle / MySQL sources: the JDBC driver is NOT bundled in Databricks Runtime. Uncomment
            # the one(s) you need (pin a version your security team has approved).
            # - maven:
            #     coordinates: "com.oracle.database.jdbc:ojdbc11:23.5.0.24.07"
            # - maven:
            #     coordinates: "com.mysql:mysql-connector-j:9.1.0"
      tags:
        business_unit: ""
        project: lakefed_ingest
      queue:
        enabled: false
      parameters:
        - name: task_collection
          default: example_cohort
        - name: db_instance
          default: ${var.lakebase_instance}
        - name: db_name
          default: ${var.lakebase_database}
        # ONE concurrency knob: max units of query work running at once in this run (CT read+MERGE,
        # a seed, one partition of a partitioned seed, a small source query, the staging swap) —
        # across all tables. Per run: concurrent collections on separate clusters each get their own.
        # 32 captured most of the gain in load tests on a 16-core driver (sweep is driver-bound); raise
        # per collection once tenant SQL Server capacity is measured.
        - name: parallelism
          default: "32"
        # Per-DB source credentials (JSON {user, password}); may be Azure Key Vault-backed.
        - name: secret_scope
          default: ${var.secret_scope}
        # Production: "false" with a trusted server certificate (SQL Server trustServerCertificate,
        # PostgreSQL sslmode verify-full vs require, MySQL sslMode VERIFY_IDENTITY vs REQUIRED).
        - name: trust_server_certificate
          default: "true"
        # Skip-no-change: tables per batched change-detection statement (one source query per chunk).
        - name: detection_chunk
          default: "200"
