# Automated prerequisites: the Lakebase OLTP instance + its UC-registered database, the source
# credential secret scope, and a setup job that applies / migrates the Lakebase schema (control,
# checkpoints, reseed queue, telemetry).
#
# NOTE: deploying this file CREATES BILLABLE INFRASTRUCTURE (a Lakebase instance). To reuse
# pre-provisioned resources instead, adopt them with `databricks bundle deployment bind` before the
# first deploy (see docs/deploy.md). The remaining manual step is loading per-database source
# credentials into the secret scope (or pointing `secret_scope` at an Azure Key Vault-backed scope).
# No UC connections or SQL warehouse are needed. Lakebase auth uses SDK-minted tokens, so there is
# no Lakebase password secret.
resources:
  database_instances:
    lakebase:
      name: ${var.lakebase_instance}
      capacity: ${var.lakebase_capacity}
      # Enable Postgres role/password login for broad client compatibility; the cluster itself
      # connects with a short-lived SDK-minted OAuth token (no stored password).
      enable_pg_native_login: true

  database_catalogs:
    lakebase_catalog:
      # Registers the Lakebase database in Unity Catalog so control / telemetry tables are queryable
      # from DBSQL (docs/monitoring.md). Named so it can't collide with the job_orchestration version's
      # `lakefed_ingest` catalog.
      name: ${var.lakebase_catalog}
      database_instance_name: ${resources.database_instances.lakebase.name}
      database_name: ${var.lakebase_database}
      create_database_if_not_exists: true

  secret_scopes:
    secret_scope:
      # Holds per-database source credentials for the JDBC reads: one JSON secret per database, named
      # by control.secret_key. For Azure Key Vault, use an AKV-backed scope instead and set the
      # `secret_scope` variable to its name (AKV names: alphanumerics + dashes only).
      #   databricks secrets put-secret <scope> <secret_key>   (value: {"user":"..","password":".."})
      name: ${var.secret_scope}

  jobs:
    lakefed_ingest_setup:
      name: "lakefed_ingest_setup"
      description: "Apply / migrate the Lakebase schema (control, hot state, telemetry). Idempotent."
      # The operations app starts this job when it finds the database behind (app/src/schema_upgrade.py); one run at
      # a time is the second guard, after the app's own lock, against two app instances starting it.
      max_concurrent_runs: 1
      # Serverless: the task only runs DDL against Lakebase (no source reads), so no cluster to wait for.
      tasks:
        - task_key: apply_lakebase_schema
          notebook_task:
            notebook_path: ../src/lakefed_ingest/apply_lakebase_schema.ipynb
            base_parameters:
              db_instance: "{{job.parameters.db_instance}}"
              db_name: "{{job.parameters.db_name}}"
          environment_key: lakebase_client
      environments:
        - environment_key: lakebase_client
          spec:
            environment_version: "4"
            dependencies:
              - "psycopg[binary]"
              - "databricks-sdk==0.145.0"
      tags:
        business_unit: ""
        project: lakefed_ingest
      queue:
        enabled: false
      parameters:
        - name: db_instance
          default: ${var.lakebase_instance}
        - name: db_name
          default: ${var.lakebase_database}
