# Multi-tenant ingestion — automated prerequisites.
# Provisions the Lakebase OLTP instance + its UC-registered database and the SQL Server secret
# scope, and a one-time setup job that applies the Lakebase schema (control, ct_checkpoint,
# reseed_queue).
#
# NOTE: deploying this file CREATES BILLABLE INFRASTRUCTURE (a Lakebase instance). The remaining
# manual step is loading per-database SQL Server credentials into the secret scope (or pointing the
# sweep's `secret_scope` parameter at an Azure Key Vault-backed scope) — see multitenant/README.md.
# No UC connections or SQL warehouse are needed. Lakebase auth uses SDK-minted tokens, so there is
# no Lakebase password secret.
resources:
  database_instances:
    mt_lakebase:
      name: lakefed-ingest-mt
      capacity: CU_1
      # Enable Postgres role/password login for broad client compatibility; the cluster itself
      # connects with a short-lived SDK-minted OAuth token (no stored password).
      enable_pg_native_login: true

  database_catalogs:
    mt_lakebase_catalog:
      name: lakefed_ingest_mt_pg
      database_instance_name: ${resources.database_instances.mt_lakebase.name}
      database_name: lakefed_ingest_mt
      create_database_if_not_exists: true

  secret_scopes:
    mt_secret_scope:
      # Holds per-database SQL Server credentials for the JDBC reads: one JSON secret per tenant DB,
      # named by control.secret_key. For Azure Key Vault, use an AKV-backed scope instead and pass
      # its name as the sweep's `secret_scope` parameter (AKV names: alphanumerics + dashes only).
      #   databricks secrets put-secret lakefed_ingest_mt <secret_key> --string-value '{"user":"..","password":".."}'
      name: lakefed_ingest_mt

  jobs:
    lakefed_ingest_mt_setup:
      name: "lakefed_ingest_mt_setup"
      description: "Apply / migrate the Lakebase schema (control, hot state, telemetry). Idempotent."
      job_clusters:
        # Small single-node cluster: the setup task only runs DDL against Lakebase.
        - job_cluster_key: setup_cluster
          new_cluster:
            spark_version: 18.x-scala2.13
            data_security_mode: SINGLE_USER
            node_type_id: ${var.mt_node_type_id}
            num_workers: 0
            spark_conf:
              spark.databricks.cluster.profile: singleNode
              spark.master: "local[*]"
            custom_tags:
              ResourceClass: SingleNode
              project: lakefed_ingest_mt
      tasks:
        - task_key: apply_lakebase_schema
          notebook_task:
            notebook_path: ../multitenant/src/multitenant/apply_lakebase_schema.ipynb
            base_parameters:
              db_instance: "{{job.parameters.db_instance}}"
              db_name: "{{job.parameters.db_name}}"
          job_cluster_key: setup_cluster
          libraries:
            - pypi:
                package: "psycopg[binary]"
            - pypi:
                package: "databricks-sdk==0.145.0"
      tags:
        business_unit: ""
        project: lakefed_ingest_mt
      queue:
        enabled: false
      parameters:
        - name: db_instance
          default: lakefed-ingest-mt
        - name: db_name
          default: lakefed_ingest_mt
