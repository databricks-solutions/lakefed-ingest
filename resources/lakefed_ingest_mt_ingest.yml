# Multi-tenant ingestion — per-(tenant db, table) job (Change-Tracking strategy).
# SINGLE-TABLE DEBUG / VALIDATION PATH: this is the explicit, one-task-per-step state machine,
# handy for developing and debugging A/B/F on a single table. At scale, lakefed_ingest_mt_sweep
# runs this same state machine in-process for many tables per task (threads + FAIR pools) to stay
# under the workspace concurrent-task-run limit. This job is not the default entry point.
# State machine (phase in Lakebase): seeding -> cdc.
#   seeding : capture V0 (before seed) -> full seed copy -> checkpoint {V0, cdc}
#   cdc     : reseed check -> capture upper-bound version -> CHANGETABLE read + PK MERGE -> advance checkpoint
# All metadata (config + hot state) lives in Lakebase: get_task reads config on the job cluster
# and publishes it as task values; governed CT reads run on the DBSQL warehouse; Lakebase writes
# run on the cluster. Reuses the production get_src_tbl_metadata / create_sink_table / copy_data
# (seed) files unchanged. The CT-specific tasks (ct_current_version, reseed_check, copy_data_ct)
# are owned by Alex (workstreams A/B/F) and ship here as stubs until implemented.
resources:
  jobs:
    lakefed_ingest_mt_ingest:
      name: "lakefed_ingest_mt_ingest"
      description: "Single-table debug path: seed->CT->MERGE for one tenant db/table."
      max_concurrent_runs: 32
      tasks:
        # --- read config from Lakebase, publish as task values ------------------------
        - task_key: get_task
          notebook_task:
            notebook_path: ../multitenant/src/multitenant/get_task.ipynb
            base_parameters:
              task_id: "{{job.parameters.task_id}}"
              db_instance: "{{job.parameters.db_instance}}"
              db_name: "{{job.parameters.db_name}}"
          existing_cluster_id: ${var.mt_cluster_id}
          libraries:
            - pypi:
                package: "psycopg[binary]"
            - pypi:
                package: "databricks-sdk==0.145.0"
        # --- shared prelude (reused production files, now fed from task values) --------
        - task_key: get_src_tbl_metadata
          depends_on:
            - task_key: get_task
          sql_task:
            file:
              path: ../src/lakefed_ingest/get_src_tbl_metadata.sql
            parameters:
              src_catalog: "{{tasks.get_task.values.src_catalog}}"
              src_schema: "{{tasks.get_task.values.src_schema}}"
              src_table: "{{tasks.get_task.values.src_table}}"
              select_list: "{{tasks.get_task.values.select_list}}"
              use_remote_query: "{{tasks.get_task.values.use_remote_query}}"
              src_type: "{{tasks.get_task.values.src_type}}"
              src_connection: "{{tasks.get_task.values.src_connection}}"
              src_database: "{{tasks.get_task.values.src_database}}"
            warehouse_id: ${var.warehouse_id}
        - task_key: create_sink_table
          depends_on:
            - task_key: get_src_tbl_metadata
          notebook_task:
            notebook_path: ../src/lakefed_ingest/create_sink_table.ipynb
            base_parameters:
              src_catalog: "{{tasks.get_task.values.src_catalog}}"
              src_schema: "{{tasks.get_task.values.src_schema}}"
              src_table: "{{tasks.get_task.values.src_table}}"
              select_list: "{{tasks.get_task.values.select_list}}"
              tgt_catalog: "{{tasks.get_task.values.sink_catalog}}"
              tgt_schema: "{{tasks.get_task.values.sink_schema}}"
              tgt_table: "{{tasks.get_task.values.sink_table}}"
              load_partitioned: "{{tasks.get_task.values.load_partitioned}}"
              enable_iceberg_reads: "{{tasks.get_task.values.enable_iceberg_reads}}"
              sink_cluster_cols: "{{tasks.get_task.values.sink_cluster_cols}}"
              src_tbl_metadata: "{{tasks.get_src_tbl_metadata.output.first_row.json_metadata}}"
            source: WORKSPACE
            warehouse_id: ${var.warehouse_id}
        # --- read checkpoint + branch on phase ----------------------------------------
        - task_key: get_checkpoint
          depends_on:
            - task_key: create_sink_table
          notebook_task:
            notebook_path: ../multitenant/src/multitenant/get_checkpoint.ipynb
            base_parameters:
              src_database: "{{tasks.get_task.values.src_database}}"
              src_schema: "{{tasks.get_task.values.src_schema}}"
              src_table: "{{tasks.get_task.values.src_table}}"
              db_instance: "{{job.parameters.db_instance}}"
              db_name: "{{job.parameters.db_name}}"
          existing_cluster_id: ${var.mt_cluster_id}
          libraries:
            - pypi:
                package: "psycopg[binary]"
            - pypi:
                package: "databricks-sdk==0.145.0"
        - task_key: if_seeding
          depends_on:
            - task_key: get_checkpoint
          condition_task:
            op: EQUAL_TO
            left: "{{tasks.get_checkpoint.values.phase}}"
            right: "seeding"
        # --- seeding branch: capture V0 -> seed -> checkpoint {V0, cdc} ---------------
        - task_key: seed_capture_v0
          depends_on:
            - task_key: if_seeding
              outcome: "true"
          sql_task:
            file:
              path: ../multitenant/src/multitenant/ct_current_version.sql
            parameters:
              src_connection: "{{tasks.get_task.values.src_connection}}"
              src_database: "{{tasks.get_task.values.src_database}}"
            warehouse_id: ${var.warehouse_id}
        - task_key: seed_copy
          depends_on:
            - task_key: seed_capture_v0
          notebook_task:
            notebook_path: ../src/lakefed_ingest/copy_data.ipynb
            base_parameters:
              sink_catalog: "{{tasks.get_task.values.sink_catalog}}"
              sink_schema: "{{tasks.get_task.values.sink_schema}}"
              sink_table: "{{tasks.get_task.values.sink_table}}"
              src_catalog: "{{tasks.get_task.values.src_catalog}}"
              src_schema: "{{tasks.get_task.values.src_schema}}"
              src_table: "{{tasks.get_task.values.src_table}}"
              select_list: "{{tasks.get_task.values.select_list}}"
              use_remote_query: "{{tasks.get_task.values.use_remote_query}}"
              src_type: "{{tasks.get_task.values.src_type}}"
              src_connection: "{{tasks.get_task.values.src_connection}}"
              src_database: "{{tasks.get_task.values.src_database}}"
            source: WORKSPACE
            warehouse_id: ${var.warehouse_id}
        - task_key: checkpoint_seed
          depends_on:
            - task_key: seed_copy
          notebook_task:
            notebook_path: ../multitenant/src/multitenant/checkpoint_seed.ipynb
            base_parameters:
              src_database: "{{tasks.get_task.values.src_database}}"
              src_schema: "{{tasks.get_task.values.src_schema}}"
              src_table: "{{tasks.get_task.values.src_table}}"
              db_instance: "{{job.parameters.db_instance}}"
              db_name: "{{job.parameters.db_name}}"
              v0: "{{tasks.seed_capture_v0.output.first_row.ct_version}}"
          existing_cluster_id: ${var.mt_cluster_id}
          libraries:
            - pypi:
                package: "psycopg[binary]"
            - pypi:
                package: "databricks-sdk==0.145.0"
        # --- cdc branch: reseed check -> capture upper bound -> read+merge -> advance -
        - task_key: reseed_check
          depends_on:
            - task_key: if_seeding
              outcome: "false"
          sql_task:
            file:
              path: ../multitenant/src/multitenant/reseed_check.sql
            parameters:
              src_connection: "{{tasks.get_task.values.src_connection}}"
              src_database: "{{tasks.get_task.values.src_database}}"
              src_schema: "{{tasks.get_task.values.src_schema}}"
              src_table: "{{tasks.get_task.values.src_table}}"
            warehouse_id: ${var.warehouse_id}
        - task_key: if_reseed
          depends_on:
            - task_key: reseed_check
          # Retention lapsed when the minimum valid version has advanced past our checkpoint.
          condition_task:
            op: GREATER_THAN
            left: "{{tasks.reseed_check.output.first_row.min_valid_version}}"
            right: "{{tasks.get_checkpoint.values.ct_version}}"
        - task_key: mark_reseed
          depends_on:
            - task_key: if_reseed
              outcome: "true"
          notebook_task:
            notebook_path: ../multitenant/src/multitenant/mark_reseed.ipynb
            base_parameters:
              src_database: "{{tasks.get_task.values.src_database}}"
              src_schema: "{{tasks.get_task.values.src_schema}}"
              src_table: "{{tasks.get_task.values.src_table}}"
              db_instance: "{{job.parameters.db_instance}}"
              db_name: "{{job.parameters.db_name}}"
          existing_cluster_id: ${var.mt_cluster_id}
          libraries:
            - pypi:
                package: "psycopg[binary]"
            - pypi:
                package: "databricks-sdk==0.145.0"
        - task_key: cdc_capture_version
          depends_on:
            - task_key: if_reseed
              outcome: "false"
          # Upper-bound version captured BEFORE the read; checkpoint advances to it after the
          # merge commits (any later change is picked up next cycle -> at-least-once).
          sql_task:
            file:
              path: ../multitenant/src/multitenant/ct_current_version.sql
            parameters:
              src_connection: "{{tasks.get_task.values.src_connection}}"
              src_database: "{{tasks.get_task.values.src_database}}"
            warehouse_id: ${var.warehouse_id}
        - task_key: copy_data_ct
          depends_on:
            - task_key: cdc_capture_version
          notebook_task:
            notebook_path: ../multitenant/src/multitenant/copy_data_ct.ipynb
            base_parameters:
              select_list: "{{tasks.get_task.values.select_list}}"
              primary_key: "{{tasks.get_task.values.primary_key}}"
              src_connection: "{{tasks.get_task.values.src_connection}}"
              src_database: "{{tasks.get_task.values.src_database}}"
              src_schema: "{{tasks.get_task.values.src_schema}}"
              src_table: "{{tasks.get_task.values.src_table}}"
              ct_version: "{{tasks.get_checkpoint.values.ct_version}}"
              sink_catalog: "{{tasks.get_task.values.sink_catalog}}"
              sink_schema: "{{tasks.get_task.values.sink_schema}}"
              sink_table: "{{tasks.get_task.values.sink_table}}"
            source: WORKSPACE
            warehouse_id: ${var.warehouse_id}
        - task_key: advance_checkpoint
          depends_on:
            - task_key: copy_data_ct
          notebook_task:
            notebook_path: ../multitenant/src/multitenant/advance_checkpoint.ipynb
            base_parameters:
              src_database: "{{tasks.get_task.values.src_database}}"
              src_schema: "{{tasks.get_task.values.src_schema}}"
              src_table: "{{tasks.get_task.values.src_table}}"
              db_instance: "{{job.parameters.db_instance}}"
              db_name: "{{job.parameters.db_name}}"
              new_version: "{{tasks.cdc_capture_version.output.first_row.ct_version}}"
          existing_cluster_id: ${var.mt_cluster_id}
          libraries:
            - pypi:
                package: "psycopg[binary]"
            - pypi:
                package: "databricks-sdk==0.145.0"
      tags:
        business_unit: ""
        project: lakefed_ingest_mt
      queue:
        enabled: false
      parameters:
        - name: task_id
          default: "1"
        - name: db_instance
          default: lakefed-ingest-mt
        - name: db_name
          default: lakefed_ingest_mt
