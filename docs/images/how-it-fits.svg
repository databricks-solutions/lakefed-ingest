<text x="342" y="345" font-size="14" font-weight="700" fill="#1B3139">Lakebase</text><text x="342" y="364" font-size="12" fill="#5A6F77">control rows, positions, run history</text>
<g fill="#5A6F77" font-size="11"><text x="249" y="42" text-anchor="middle">runs on</text><text x="118" y="118">reads table lists and columns only</text><text x="428" y="108">its scheduled jobs start the check</text><text x="213" y="198">asks what changed</text><text x="428" y="199">starts the runs with work</text><text x="213" y="233">reads changes</text><text x="655" y="178">MERGE or append</text><text x="428" y="295">records positions and outcomes</text><text x="618" y="282">writes control rows,</text><text x="618" y="296">reads state</text></g>
</svg>
