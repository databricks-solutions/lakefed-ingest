# Databricks asset bundle for lakefed_ingest (default version): ingestion that sweeps many tables per
# job task on cluster compute, with control / checkpoint / telemetry state in Lakebase.
# The original task-orchestrated (DBSQL warehouse) version is a separate bundle in job_orchestration/.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: lakefed_ingest_v2
  uuid: bcc77784-ecf3-4a61-9436-2f404328a013

include:
  - resources/*.yml

# Variable declarations. Defaults suit most deployments; override per target.
variables:
  # Compute (warehouse-free; jobs run on job clusters). The sweep is DRIVER-bound — per-table MERGE
  # planning + Delta commits run on the driver — so size the driver up and keep workers modest.
  # Defaults are Azure node types; override per target. Note: the defaults need ~32 cores (16-core
  # driver + 2 x 8-core workers); a subscription with a small vCPU quota must use smaller nodes or
  # raise the quota first.
  node_type_id:
    description: Worker (and setup single-node) node type.
    default: Standard_D8ds_v5
  driver_node_type_id:
    description: Driver node type for the ingestion job (driver-bound; size this up first).
    default: Standard_D16ds_v5
  num_workers:
    description: Worker count for the ingestion job cluster.
    default: 2
  # State (Lakebase) and credentials.
  lakebase_instance:
    description: Lakebase instance holding control, checkpoint, and telemetry state.
    default: lakefed-ingest
  lakebase_capacity:
    description: Lakebase instance size (CU_1, CU_2, CU_4 or CU_8). Size up for collections of hundreds of thousands of tables, or many collections sweeping at once.
    default: CU_1
  lakebase_database:
    description: Postgres database on the Lakebase instance.
    default: lakefed_ingest
  deleted_job_retention_days:
    description: Days a deleted operations-app job is kept, so it can be restored, before the delete job purges it. The app's DELETED_JOB_RETENTION_DAYS (app/databricks.yml) must have the same value.
    default: 7
  lakebase_catalog:
    description: Unity Catalog catalog the Lakebase database is registered as (for DBSQL monitoring).
    default: lakefed_ingest_lakebase
  secret_scope:
    description: Secret scope holding per-database source credentials (may be Azure Key Vault-backed).
    default: lakefed_ingest
  # Defaults of the ingestion job's tuning parameters (resources/lakefed_ingest.yml explains each); a
  # run can still override them. parallelism, append_batch_size and spark_conf are the values the
  # one-database tuning sweep validated on one Standard_D16ds_v5 driver + 1 x Standard_D8ds_v5 worker
  # (192, 4, code generation off). On a source server that hosts other work, set max_queries_per_source too.
  parallelism:
    description: Units of query work running at once in one run.
    default: "192"
  trust_server_certificate:
    description: Trust the source's TLS certificate without validating it (production false).
    default: "true"
  snapshot_isolation:
    description: Read SQL Server changes under SNAPSHOT isolation (needs ALLOW_SNAPSHOT_ISOLATION ON).
    default: "false"
  reseed_on_new_columns:
    description: Reseed a table whose select_list gained columns (false carries on from the checkpoint).
    default: "true"
  append_batch_size:
    description: Append sinks with client_id, tables per batched append ("1" = per table; 4 and 8 load alike, 16 is slower).
    default: "4"
  max_seeds_per_run:
    description: Seeds per run ("0" = no limit).
    default: "0"
  freshness_interval_s:
    description: Seconds between freshness writes for unchanged tables already at the current version ("0" = every run).
    default: "0"
  max_queries_per_source:
    description: Concurrent queries per source server across all runs, shared between them (at least 1 per run; see README "Concurrency"; "0" = no cap).
    default: "0"
  discover_workers:
    description: Databases the discovery job (lakefed_ingest_discover) reads at once, each taking its three catalog queries in turn. Capped by max_queries_per_source when that is set.
    default: "32"
  detection_chunk:
    description: Tables per batched change-detection query.
    default: "200"
  table_retries:
    description: Extra attempts per table after a transient source error, in the same run ("0" = off). Used only when table_retry_budget is above 0.
    default: "2"
  table_retry_budget:
    description: Table retries in the whole run. At "0", the default, no table is retried and a failing table fails the run at once. Each job can raise it in the app's Advanced configuration.
    default: "0"
  fail_on_table_errors:
    description: Accepted so that existing job definitions load; it no longer decides anything, as a run with failed tables always ends as failed.
    default: "false"
  spark_conf:
    description: Spark session settings for a run, a JSON object of setting to value (a string, number or boolean; blank keeps the cluster's). Code generation off saves compiling every append's plan (+26% tables per second on one cluster in the sweep).
    default: '{"spark.sql.codegen.wholeStage": "false"}'

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://company-dev.cloud.databricks.com/


  prod:
    mode: production
    workspace:
      host: https://company-prd.cloud.databricks.com/
      # Use fixed location to make sure we only have a single copy.
      # If this path results in an error, please make sure you have a recent version of the CLI installed.
      root_path: /Workspace/${bundle.name}
