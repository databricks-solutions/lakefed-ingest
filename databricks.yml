# Databricks asset bundle for lakefed_ingest (default version): ingestion that sweeps many tables per
# job task on cluster compute, with control / checkpoint / telemetry state in Lakebase, and the operations
# app (app/). One `databricks bundle deploy -t <target>` creates everything, applies the Lakebase schema
# (the lakefed_ingest_setup run), starts the app with its code and gives it its access (the
# lakefed_ingest_app_grants run); see docs/deploy.md.
# The legacy task-orchestrated (DBSQL warehouse) version is a separate bundle in job_orchestration/.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: lakefed_ingest_v2
  uuid: bcc77784-ecf3-4a61-9436-2f404328a013
  # job_runs (the setup and grants runs during deploy) re-fire on every deploy from 1.13.0.
  databricks_cli_version: ">= 1.13.0"

include:
  - resources/*.yml
  - app/resources/*.yml

# Variable declarations. Defaults suit most deployments; override per target.
variables:
  # Compute (warehouse-free; jobs run on job clusters). The sweep is DRIVER-bound — per-table MERGE
  # planning + Delta commits run on the driver — so size the driver up and keep workers modest.
  # Defaults are Azure node types; override per target. Note: the defaults need ~32 cores (16-core
  # driver + 2 x 8-core workers); a subscription with a small vCPU quota must use smaller nodes or
  # raise the quota first.
  node_type_id:
    description: Worker (and setup single-node) node type.
    default: Standard_D8ds_v5
  driver_node_type_id:
    description: Driver node type for the ingestion job (driver-bound; size this up first).
    default: Standard_D16ds_v5
  num_workers:
    description: Worker count for the ingestion job cluster.
    default: 2
  # State (Lakebase) and credentials.
  lakebase_instance:
    description: Lakebase instance holding control, checkpoint, and telemetry state.
    default: lakefed-ingest
  lakebase_capacity:
    description: Lakebase instance size (CU_1, CU_2, CU_4 or CU_8). Size up for collections of hundreds of thousands of tables, or many collections sweeping at once.
    default: CU_1
  lakebase_database:
    description: Postgres database on the Lakebase instance.
    default: lakefed_ingest
  deleted_job_retention_days:
    description: Days a deleted operations-app job is kept, so it can be restored, before the delete job's daily run
      purges it. The app is told the same value (DELETED_JOB_RETENTION_DAYS).
    default: 7
  lakebase_catalog:
    description: Unity Catalog catalog the Lakebase database is registered as (for DBSQL monitoring).
    default: lakefed_ingest_lakebase
  secret_scope:
    description: Secret scope holding per-database source credentials (may be Azure Key Vault-backed).
    default: lakefed_ingest
  # Defaults of the ingestion job's tuning parameters (resources/lakefed_ingest.yml explains each); a
  # run can still override them. parallelism, append_batch_size and spark_conf are the values the
  # one-database tuning sweep validated on one Standard_D16ds_v5 driver + 1 x Standard_D8ds_v5 worker
  # (192, 4, code generation off). On a source server that hosts other work, set max_queries_per_source too.
  parallelism:
    description: Units of query work running at once in one run.
    default: "192"
  trust_server_certificate:
    description: Trust the source's TLS certificate without validating it (production false).
    default: "true"
  snapshot_isolation:
    description: Read SQL Server changes under SNAPSHOT isolation (needs ALLOW_SNAPSHOT_ISOLATION ON).
    default: "false"
  reseed_on_new_columns:
    description: Reseed a table whose select_list gained columns (false carries on from the checkpoint).
    default: "true"
  append_batch_size:
    description: Append sinks with client_id, tables per batched append ("1" = per table; 4 and 8 load alike, 16 is slower).
    default: "4"
  max_seeds_per_run:
    description: Seeds per run ("0" = no limit).
    default: "0"
  freshness_interval_s:
    description: Seconds between freshness writes for unchanged tables already at the current version ("0" = every run).
    default: "0"
  max_queries_per_source:
    description: Concurrent queries per source server across all runs, shared between them (at least 1 per run; see docs/how-it-works.md, "Concurrency"; "0" = no cap).
    default: "0"
  discover_workers:
    description: Databases the discovery job (lakefed_ingest_discover) reads at once, each taking its three catalog queries in turn. Capped by max_queries_per_source when that is set.
    default: "32"
  detection_chunk:
    description: Tables per batched change-detection query.
    default: "200"
  table_retries:
    description: Extra attempts per table after a transient source error, in the same run ("0" = off). Used only when table_retry_budget is above 0.
    default: "2"
  table_retry_budget:
    description: Table retries in the whole run. At "0", the default, no table is retried and a failing table fails the run at once. Each job can raise it in the app's Advanced configuration.
    default: "0"
  fail_on_table_errors:
    description: Accepted so that existing job definitions load; it no longer decides anything, as a run with failed tables always ends as failed.
    default: "false"
  spark_conf:
    description: Spark session settings for a run, a JSON object of setting to value (a string, number or boolean; blank keeps the cluster's). Code generation off saves compiling every append's plan (+26% tables per second on one cluster in the sweep).
    default: '{"spark.sql.codegen.wholeStage": "false"}'

  # The operations app (app/resources/lakefed_ingest_app.yml). It is told the ingestion jobs' ids and the
  # Lakebase names above by reference, so a target sets none of them for the app.
  app_name:
    description: App name (lowercase letters, digits and dashes; 30 characters max).
    default: lakefed-ingest-ops
  app_managers:
    description: Who manages the app (sees Manage) besides workspace admins, users or groups, comma separated. By
      default the user who deploys the bundle.
    default: ${workspace.current_user.userName}
  app_version:
    description: The version the app shows under Manage. By default the commit deployed from; it is blank when the
      bundle is deployed from a folder that isn't a git checkout, so pass --var app_version=<commit> there.
    default: ${bundle.git.commit}
  source_connections:
    description: Unity Catalog connections the app discovers through, comma-separated. The grants job gives the
      app's service principal USE CONNECTION on each, as whoever runs it (that person needs to own or manage them).
    default: ""
  discovery_warehouse_size:
    description: Size of the serverless SQL warehouse discovery runs on (the connection test, the database list and the
      tables of the chosen databases). Catalog queries only, so the smallest size; more clusters, not a bigger size, if
      many statements queue.
    default: 2X-Small
  discovery_warehouse_max_clusters:
    description: The most clusters the discovery warehouse scales out to when its statements queue.
    default: 2
  discovery_warehouse_auto_stop_mins:
    description: Idle minutes before the discovery warehouse stops. It is used only while someone chooses tables.
    default: 5
  app_warehouse_id:
    description: Id of a SQL warehouse of your own for the app's queries (the connection test, the database list, the
      access checks and the table reads through remote_query), say one that runs in your network and reaches sources
      serverless can't. Blank (the default) uses the bundle's own discovery warehouse. It must be Pro or serverless, on
      version 2025.35 or above; remote_query doesn't run on a Classic warehouse. The lakefed_ingest_app_grants job gives
      the app's service principal CAN_USE on it, as whoever runs that job (who needs CAN_MANAGE on the warehouse).
    default: ""
  jdbc_login_scope:
    description: Secret scope for the JDBC logins users type into the operations app. This bundle creates it, so its
      deployer holds MANAGE; the lakefed_ingest_app_grants job gives the app's service principal WRITE on it and nothing
      more. Deploy this bundle as the user who runs the ingestion jobs, since that user is the scope's creator (MANAGE)
      and the jobs read the logins as their run-as identity.
    default: lakefed_ingest_jdbc_logins
  reads_cap:
    description: How many databases of one source server are checked or read through the warehouse at once (one
      statement each, counted across every discovery and app instance), a fixed number whatever the reads take. Never
      below 4 and at most 256. An older deploy that still sets READS_START_CAP on the app is read when this is not set.
    default: 8

# Two targets, and nothing per workspace in them: the profile you deploy with (-p <profile>) names the workspace.
# Set any variable above for one target under targets.<name>.variables, or pass --var name=value.
targets:
  # A development copy: names are prefixed with '[dev <your user name>] ' and job schedules are paused
  # (https://docs.databricks.com/dev-tools/bundles/deployment-modes.html). The default, so a command without -t
  # never reaches prod.
  dev:
    mode: development
    default: true

  prod:
    mode: production
    workspace:
      # Production mode needs a fixed folder, so there is only one copy.
      root_path: /Workspace/${bundle.name}
