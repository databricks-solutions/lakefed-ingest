# The unit tests for every pull request and every push to main: the whole pytest suite (both versions and the
# operations app, pytest.ini), the Postgres-backed tests against a throwaway Postgres 16, and the frontend's type
# check and build. Nothing here reaches Databricks or a source database, so it needs no secrets; live tests stay
# manual (README, Tests).
name: tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # 3.11 for the operations app (Databricks Apps), 3.12 for the jobs (Databricks Runtime 18).
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: app/src/requirements.txt

      # The frontend tests run node --test on TypeScript files, which needs Node's built-in type stripping (22.18+).
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: app/src/package-lock.json

      # The app connects with sslmode=require, and the Postgres tests open many connections at once.
      - name: Start Postgres 16 with SSL
        run: |
          mkdir -p "$RUNNER_TEMP/pgssl"
          openssl req -new -x509 -days 2 -nodes -subj "/CN=localhost" \
            -keyout "$RUNNER_TEMP/pgssl/server.key" -out "$RUNNER_TEMP/pgssl/server.crt"
          sudo chown 999:999 "$RUNNER_TEMP/pgssl/server.key" "$RUNNER_TEMP/pgssl/server.crt"   # the image's postgres user
          sudo chmod 600 "$RUNNER_TEMP/pgssl/server.key"
          docker run -d --name pg -p 5432:5432 -e POSTGRES_HOST_AUTH_METHOD=trust \
            -v "$RUNNER_TEMP/pgssl:/certs:ro" postgres:16 \
            -c ssl=on -c ssl_cert_file=/certs/server.crt -c ssl_key_file=/certs/server.key -c max_connections=400
          # The image starts a temporary server for its init scripts first; wait for the real one.
          for i in $(seq 1 60); do
            if docker logs pg 2>&1 | grep -q "PostgreSQL init process complete" && docker exec pg pg_isready -U postgres -q; then
              exit 0
            fi
            sleep 1
          done
          docker logs pg
          exit 1

      - name: Install Python packages
        run: pip install pytest httpx pyyaml -r app/src/requirements.txt

      - name: Install, type-check and build the frontend
        working-directory: app/src
        run: |
          npm ci --no-audit --no-fund
          npm run check

      - name: Run the tests
        env:
          LAKEFED_TEST_PG: postgresql://postgres@localhost:5432/postgres
          LAKEFED_APP_TEST_PG: postgresql://postgres@localhost:5432/postgres
        run: pytest -q -p no:cacheprovider
